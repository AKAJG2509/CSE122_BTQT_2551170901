<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 11</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="gallery-container">
        
        <header class="header-block">
            <h1 class="page-title">Thư viện ảnh Việt Nam</h1>
            <p class="page-subtitle">Bộ sưu tập 6 danh thắng tiêu biểu — minh hoạ thẻ figure / figcaption.</p>
        </header>

        <section class="gallery-grid">
            
            <figure class="gallery-card">
                <img src="images/OIP-5.jpg" alt="Vịnh Hạ Long" class="gallery-img">
                <figcaption class="gallery-caption">Hình 1. Vịnh Hạ Long</figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="images/OIP-6.jpg" alt="Hang Sơn Đoòng" class="gallery-img">
                <figcaption class="gallery-caption">Hình 2. Hang Sơn Đoòng</figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="images/OIP-7.jpg" alt="Thác Bản Giốc" class="gallery-img">
                <figcaption class="gallery-caption">Hình 3. Thác Bản Giốc</figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="images/fansipan.jpg" alt="Fansipan" class="gallery-img">
                <figcaption class="gallery-caption">Hình 4. Fansipan</figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="images/fansipan.jpg" alt="Đồng bằng sông Cửu Long" class="gallery-img">
                <figcaption class="gallery-caption">Hình 5. Đồng bằng sông Cửu Long</figcaption>
            </figure>

            <figure class="gallery-card">
                <img src="images/dong-bang-song-cuu-long.webp" alt="Động Phong Nha" class="gallery-img">
                <figcaption class="gallery-caption">Hình 6. Động Phong Nha</figcaption>
            </figure>

        </section>

    </main>

</body>
</html>
